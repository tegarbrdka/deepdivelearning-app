version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: educlassify_backend
    restart: always
    volumes:
      # Persist the database and uploads directory
      - db_data:/app/data
      - ./backend/uploads:/app/backend/uploads
    environment:
      - DATABASE_URL=sqlite:////app/data/educlassify.db
      - ALLOWED_ORIGINS=*
    # We do not expose port 8000 to host directly, only internally to Nginx

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: educlassify_frontend
    restart: always
    ports:
      - "80:80"
    volumes:
      # Inject custom nginx config
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend

volumes:
  db_data:
